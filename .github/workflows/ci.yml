name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -w $(find . -name '*.go' -not -path './.git/*')
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
